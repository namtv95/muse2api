version: '3.8'

services:
  muse2api:
    # Build with the upstream commit this branch contains, so the admin page compares the right one:
    #   BUILD_SHA=$(git merge-base HEAD upstream/main) docker compose up -d --build
    build:
      context: .
      args:
        BUILD_SHA: ${BUILD_SHA:-}
    image: muse2api:latest
    container_name: muse2api
    restart: always
    ports:
      - "18610:18610"
    environment:
      # 管理与 API 鉴权 Key（从 .env 或宿主环境读取，留空则自动生成）
      - MUSE2API_KEY=${MUSE2API_KEY:-}
      # 服务对外基准 URL，如 https://your-domain.com（留空则管理前端自动检测当前域名）
      - MUSE2API_PUBLIC_BASE=
      # 超时配置（秒）
      - MUSE2API_IMAGE_TIMEOUT=240
      - MUSE2API_VIDEO_TIMEOUT=600
      - MUSE2API_CHAT_TIMEOUT=300
      # 1: the admin page's Upgrade button is off (it would overwrite this fork's code inside the container)
      - MUSE2API_MANAGED_DEPLOYMENT=1
    volumes:
      # 持久化账号配置、任务日志及媒体文件
      - ./data:/app/data
    shm_size: '2gb' # 保证 Chromium 渲染多标签页时不因 /dev/shm 耗尽崩溃
